<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<title>A3 ArUco CM Clean</title>

<script src="https://docs.opencv.org/4.x/opencv.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>

<style>
  body { margin:0; overflow:hidden; }
  video { position:absolute; top:0; left:0; width:100%; }
  canvas { position:absolute; top:0; left:0; }
</style>
</head>

<body>

<video id="video" autoplay playsinline></video>

<script>

// =========================
// CONFIG A3 (cm real)
// =========================
const A3_W = 42;
const A3_H = 29.7;

const SMOOTH = 0.2;

// =========================
// CAMERA
// =========================
const video = document.getElementById("video");

navigator.mediaDevices.getUserMedia({ video:true })
.then(stream => video.srcObject = stream);

// =========================
// THREE.JS
// =========================
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  70, innerWidth/innerHeight, 0.1, 1000
);
camera.position.z = 60;

const renderer = new THREE.WebGLRenderer({ alpha:true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// HOUSE (replace GLB later if needed)
const house = new THREE.Mesh(
  new THREE.BoxGeometry(30, 10, 20), // 30x10x20 cm
  new THREE.MeshNormalMaterial()
);
scene.add(house);

// smooth position
let smoothPos = new THREE.Vector3();

function lerp(a,b,t){ return a + (b-a)*t; }

function smoothVec(cur, tgt){
  cur.x = lerp(cur.x, tgt.x, SMOOTH);
  cur.y = lerp(cur.y, tgt.y, SMOOTH);
  cur.z = lerp(cur.z, tgt.z, SMOOTH);
}

// =========================
// OPEN CV
// =========================
let src, gray;

function initCV(){
  src = new cv.Mat(video.videoHeight, video.videoWidth, cv.CV_8UC4);
  gray = new cv.Mat();
}

// =========================
// MAIN LOOP
// =========================
function loop(){

  if(!video.videoWidth){
    requestAnimationFrame(loop);
    return;
  }

  let cap = new cv.VideoCapture(video);
  cap.read(src);

  cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);

  let dict = new cv.aruco.getPredefinedDictionary(
    cv.aruco.DICT_4X4_50
  );

  let corners = new cv.MatVector();
  let ids = new cv.Mat();

  cv.aruco.detectMarkers(gray, dict, corners, ids);

  // =========================
  // NEED 4 MARKERS
  // =========================
  if(ids.rows >= 4){

    let pts = [];

    for(let i=0;i<4;i++){

      let c = corners.get(i).data32F;

      let cx = (c[0]+c[2]+c[4]+c[6])/4;
      let cy = (c[1]+c[3]+c[5]+c[7])/4;

      pts.push(new THREE.Vector3(cx, cy, 0));
    }

    // =========================
    // A3 ORIGIN + AXIS
    // =========================
    let origin = pts[0];

    let xAxis = pts[1].clone().sub(pts[0]).normalize();
    let yAxis = pts[2].clone().sub(pts[0]).normalize();

    // =========================
    // CENTER OF A3 (cm system)
    // =========================
    let center = origin.clone()
      .add(xAxis.clone().multiplyScalar(A3_W/2))
      .add(yAxis.clone().multiplyScalar(A3_H/2));

    // map to world
    center.x /= 10;
    center.y = -center.y / 10;

    // =========================
    // SMOOTHING (ลดสั่น)
    // =========================
    smoothVec(smoothPos, center);

    house.position.copy(smoothPos);

    // fixed scale (real size feel)
    house.scale.set(1,1,1);
  }

  renderer.render(scene, camera);

  requestAnimationFrame(loop);
}

// =========================
video.onloadedmetadata = () => {
  initCV();
  loop();
};

</script>

</body>
</html>
