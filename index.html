<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Floor Plan AR</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; }

    #ui-overlay {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 999;
      pointer-events: none;
    }

    #status-bar {
      background: rgba(0,0,0,0.6);
      color: white;
      font-family: sans-serif;
      font-size: 13px;
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #marker-status {
      display: flex;
      gap: 8px;
    }

    .dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      background: #555;
      display: inline-block;
      transition: background 0.3s;
    }
    .dot.found { background: #00ff88; }

    #hint {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.65);
      color: white;
      font-family: sans-serif;
      font-size: 14px;
      padding: 10px 20px;
      border-radius: 20px;
      z-index: 999;
      pointer-events: none;
      transition: opacity 0.5s;
      text-align: center;
    }

    #debug-panel {
      position: fixed;
      bottom: 80px;
      left: 10px;
      background: rgba(0,0,0,0.5);
      color: #0f0;
      font-family: monospace;
      font-size: 11px;
      padding: 8px;
      border-radius: 6px;
      z-index: 999;
      display: none; /* ซ่อนไว้ก่อน เปิดได้ด้วยการแตะ 3 ครั้ง */
    }
  </style>
</head>
<body>

<!-- UI Overlay -->
<div id="ui-overlay">
  <div id="status-bar">
    <span>📐 Floor Plan AR &nbsp;|&nbsp; Scale 1:50</span>
    <div id="marker-status">
      <span class="dot" id="dot0" title="id0"></span>
      <span class="dot" id="dot1" title="id1"></span>
      <span class="dot" id="dot2" title="id2"></span>
      <span class="dot" id="dot3" title="id3"></span>
    </div>
  </div>
</div>

<div id="hint">ชี้กล้องไปที่ Marker บน Floor Plan</div>

<div id="debug-panel" id="debug">
  <div>pos: <span id="dbg-pos">-</span></div>
  <div>rot: <span id="dbg-rot">-</span></div>
  <div>found: <span id="dbg-found">0</span>/4</div>
</div>

<!-- A-Frame + AR.js -->
<script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

<a-scene
  embedded
  arjs="sourceType: webcam;
        debugUIEnabled: false;
        detectionMode: mono_and_matrix;
        matrixCodeType: 3x3;
        patternRatio: 0.75;"
  renderer="logarithmicDepthBuffer: true; antialias: true; alpha: true;"
  vr-mode-ui="enabled: false"
  loading-screen="enabled: false"
>

  <!--
    ===================================================
    MARKER SIZE CALCULATION
    ===================================================
    Marker จริงบนกระดาษ = 2 cm = 0.02 m
    Scale กระดาษ = 1:50
    markerSize ใน AR.js = ขนาด marker จริง (เมตร) = 0.02

    Model scale:
    ArchiCAD export หน่วยเป็น meter
    ต้องการให้ model ขนาดเท่า floor plan บนกระดาษ (1:50)
    → scale = 1/50 = 0.02
    ===================================================
  -->

  <!-- ==================== MARKER 0 — ซ้ายบน (ORIGIN) ==================== -->
  <!--
    id0 เป็น origin หลัก — 3D model ถูก attach ที่นี่
    position ของ model ต้องปรับให้ origin ของ model ตรงกับมุมซ้ายบนของ floor plan
  -->
  <a-marker
    type="pattern"
    url="id0.patt"
    id="marker0"
    size="0.02"
    smooth="true"
    smoothCount="10"
    smoothTolerance="0.01"
    smoothThreshold="5"
  >
    <!--
      3D MODEL
      - scale: 0.02 = 1:50 (ปรับได้ถ้า model ใหญ่/เล็กเกิน)
      - rotation: -90 0 0 เพราะ ArchiCAD export แกน Z ขึ้น ต้องหมุนให้นอนราบ
      - position: 0 0 0 ไว้ก่อน → ปรับทีหลังหลังทดสอบ
    -->
    <a-entity
      id="building"
      gltf-model="url(Test.glb)"
      scale="0.02 0.02 0.02"
      position="0 0 0"
      rotation="-90 0 0"
      visible="true"
    ></a-entity>

    <!-- Helper: แสดงจุด origin (ลบออกได้ภายหลัง) -->
    <a-sphere color="#ff0000" radius="0.005" position="0 0.01 0"></a-sphere>
  </a-marker>

  <!-- ==================== MARKER 1 — ขวาบน ==================== -->
  <a-marker
    type="pattern"
    url="id1.patt"
    id="marker1"
    size="0.02"
    smooth="true"
    smoothCount="10"
    smoothTolerance="0.01"
    smoothThreshold="5"
  >
    <a-sphere color="#00ff00" radius="0.005" position="0 0.01 0"></a-sphere>
  </a-marker>

  <!-- ==================== MARKER 2 — ซ้ายล่าง ==================== -->
  <a-marker
    type="pattern"
    url="id2.patt"
    id="marker2"
    size="0.02"
    smooth="true"
    smoothCount="10"
    smoothTolerance="0.01"
    smoothThreshold="5"
  >
    <a-sphere color="#0000ff" radius="0.005" position="0 0.01 0"></a-sphere>
  </a-marker>

  <!-- ==================== MARKER 3 — ขวาล่าง ==================== -->
  <a-marker
    type="pattern"
    url="id3.patt"
    id="marker3"
    size="0.02"
    smooth="true"
    smoothCount="10"
    smoothTolerance="0.01"
    smoothThreshold="5"
  >
    <a-sphere color="#ffff00" radius="0.005" position="0 0.01 0"></a-sphere>
  </a-marker>

  <a-camera-static></a-camera-static>

</a-scene>

<script>
  // ============================================================
  // MARKER STATE TRACKING
  // ============================================================
  const markerStates = { 0: false, 1: false, 2: false, 3: false };
  const dots = [
    document.getElementById('dot0'),
    document.getElementById('dot1'),
    document.getElementById('dot2'),
    document.getElementById('dot3'),
  ];
  const hintEl = document.getElementById('hint');
  const building = document.getElementById('building');

  let foundCount = 0;
  let hintTimeout = null;

  function updateHint() {
    foundCount = Object.values(markerStates).filter(Boolean).length;
    document.getElementById('dbg-found').textContent = foundCount;

    if (foundCount === 0) {
      hintEl.textContent = 'ชี้กล้องไปที่ Marker บน Floor Plan';
      hintEl.style.opacity = '1';
    } else if (foundCount < 4) {
      hintEl.textContent = `พบ ${foundCount}/4 markers — เลื่อนกล้องให้เห็น marker อื่นด้วย`;
      hintEl.style.opacity = '1';
    } else {
      hintEl.textContent = '✅ พบครบ 4 markers!';
      clearTimeout(hintTimeout);
      hintTimeout = setTimeout(() => { hintEl.style.opacity = '0'; }, 2500);
    }
  }

  // ============================================================
  // LAST KNOWN POSITION — model ไม่หายเมื่อ tracking หลุด
  // ============================================================
  const marker0El = document.getElementById('marker0');

  marker0El.addEventListener('markerFound', () => {
    markerStates[0] = true;
    dots[0].classList.add('found');
    building.setAttribute('visible', true);
    updateHint();
  });

  marker0El.addEventListener('markerLost', () => {
    markerStates[0] = false;
    dots[0].classList.remove('found');
    // ไม่ซ่อน building → ค้างไว้ที่ตำแหน่งสุดท้าย
    updateHint();
  });

  // marker 1-3: แค่ track สถานะ dot
  [1, 2, 3].forEach(id => {
    const el = document.getElementById('marker' + id);
    el.addEventListener('markerFound', () => {
      markerStates[id] = true;
      dots[id].classList.add('found');
      updateHint();
    });
    el.addEventListener('markerLost', () => {
      markerStates[id] = false;
      dots[id].classList.remove('found');
      updateHint();
    });
  });

  // ============================================================
  // DEBUG PANEL — แตะ status bar 3 ครั้งเพื่อเปิด/ปิด
  // ============================================================
  let tapCount = 0;
  const debugPanel = document.getElementById('debug-panel');
  document.getElementById('status-bar').addEventListener('click', () => {
    tapCount++;
    if (tapCount >= 3) {
      tapCount = 0;
      debugPanel.style.display = debugPanel.style.display === 'none' ? 'block' : 'none';
    }
  });

  // อัพเดต debug position
  setInterval(() => {
    if (debugPanel.style.display !== 'none') {
      const pos = building.getAttribute('position');
      const rot = building.getAttribute('rotation');
      if (pos) document.getElementById('dbg-pos').textContent =
        `${pos.x.toFixed(3)}, ${pos.y.toFixed(3)}, ${pos.z.toFixed(3)}`;
      if (rot) document.getElementById('dbg-rot').textContent =
        `${rot.x.toFixed(1)}, ${rot.y.toFixed(1)}, ${rot.z.toFixed(1)}`;
    }
  }, 500);

  // ============================================================
  // SCENE LOADED
  // ============================================================
  document.querySelector('a-scene').addEventListener('loaded', () => {
    console.log('Scene loaded');
  });
</script>

</body>
</html>
