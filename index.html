<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Floor Plan AR</title>

  <script src="aframe.min.js"></script>
  <script src="aframe-ar.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; font-family: sans-serif; }

    /* ---- Status Bar ---- */
    #status-bar {
      position: fixed; top: 0; left: 0; right: 0;
      background: rgba(0,0,0,0.65);
      color: white; font-size: 13px;
      padding: 10px 16px;
      display: flex; justify-content: space-between; align-items: center;
      z-index: 999;
    }
    #marker-status { display: flex; gap: 6px; align-items: center; }
    .dot {
      width: 11px; height: 11px; border-radius: 50%;
      background: #444; transition: background 0.3s;
    }
    .dot.found { background: #00ff88; box-shadow: 0 0 6px #00ff88; }

    /* ---- Hint Bar ---- */
    #hint {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.65); color: white; font-size: 14px;
      padding: 10px 22px; border-radius: 22px;
      z-index: 999; white-space: nowrap;
      transition: background 0.3s;
      pointer-events: none;
    }
    #hint.success { background: rgba(0,150,80,0.85); }
    #hint.error   { background: rgba(180,0,0,0.85); }

    /* ---- Debug Panel (เปิดด้วยการแตะ title 3 ครั้ง) ---- */
    #debug {
      display: none;
      position: fixed; bottom: 80px; left: 10px;
      background: rgba(0,0,0,0.7); color: #0f0;
      font-family: monospace; font-size: 11px;
      padding: 8px 12px; border-radius: 8px;
      z-index: 999; line-height: 1.8;
    }

    /* ---- Controls ---- */
    #controls {
      position: fixed; top: 48px; right: 10px;
      display: flex; flex-direction: column; gap: 8px;
      z-index: 999;
    }
    .ctrl-btn {
      background: rgba(0,0,0,0.6); color: white;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px; padding: 8px 12px;
      font-size: 13px; cursor: pointer;
      transition: background 0.2s;
    }
    .ctrl-btn:active { background: rgba(255,255,255,0.2); }
  </style>
</head>
<body>

<!-- Status Bar -->
<div id="status-bar">
  <span id="title-tap">📐 Floor Plan AR &nbsp;|&nbsp; 1:50</span>
  <div id="marker-status">
    <div class="dot" id="dot0" title="id0 ซ้ายบน"></div>
    <div class="dot" id="dot1" title="id1 ขวาบน"></div>
    <div class="dot" id="dot2" title="id2 ซ้ายล่าง"></div>
    <div class="dot" id="dot3" title="id3 ขวาล่าง"></div>
  </div>
</div>

<!-- Hint -->
<div id="hint">ชี้กล้องไปที่ Marker บน Floor Plan</div>

<!-- Scale / Position Controls -->
<div id="controls">
  <button class="ctrl-btn" id="btn-scale-up">＋ Scale</button>
  <button class="ctrl-btn" id="btn-scale-down">－ Scale</button>
  <button class="ctrl-btn" id="btn-rot">↻ Rotate</button>
  <button class="ctrl-btn" id="btn-reset">⟳ Reset</button>
</div>

<!-- Debug Panel -->
<div id="debug">
  <div>scale: <span id="dbg-scale">—</span></div>
  <div>pos:   <span id="dbg-pos">—</span></div>
  <div>rot:   <span id="dbg-rot">—</span></div>
  <div>found: <span id="dbg-found">0</span>/4</div>
</div>

<!-- AR Scene -->
<a-scene
  embedded
  arjs="sourceType: webcam;
        debugUIEnabled: false;
        detectionMode: mono_and_matrix;
        matrixCodeType: 3x3;
        patternRatio: 0.75;
        maxDetectionRate: 60;"
  renderer="logarithmicDepthBuffer: true; antialias: true; alpha: true;"
  vr-mode-ui="enabled: false"
  loading-screen="enabled: false"
>

  <!-- MARKER 0 — ซ้ายบน (ORIGIN ของ model) -->
  <a-marker type="pattern" url="id0.patt" id="marker0" size="0.02"
    smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">

    <a-entity
      id="building"
      gltf-model="url(Test.glb)"
      scale="0.02 0.02 0.02"
      position="0 0 0"
      rotation="-90 0 0">
    </a-entity>

    <!-- origin dot (ลบได้ภายหลัง) -->
    <a-sphere color="#ff3333" radius="0.006" position="0 0.012 0"
      material="shader: flat;"></a-sphere>
  </a-marker>

  <!-- MARKER 1 — ขวาบน -->
  <a-marker type="pattern" url="id1.patt" id="marker1" size="0.02"
    smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">
    <a-sphere color="#33ff66" radius="0.006" position="0 0.012 0"
      material="shader: flat;"></a-sphere>
  </a-marker>

  <!-- MARKER 2 — ซ้ายล่าง -->
  <a-marker type="pattern" url="id2.patt" id="marker2" size="0.02"
    smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">
    <a-sphere color="#3366ff" radius="0.006" position="0 0.012 0"
      material="shader: flat;"></a-sphere>
  </a-marker>

  <!-- MARKER 3 — ขวาล่าง -->
  <a-marker type="pattern" url="id3.patt" id="marker3" size="0.02"
    smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">
    <a-sphere color="#ffee33" radius="0.006" position="0 0.012 0"
      material="shader: flat;"></a-sphere>
  </a-marker>

  <a-camera-static></a-camera-static>
</a-scene>

<script>
  // ============================================================
  // STATE
  // ============================================================
  const building   = document.getElementById('building');
  const hintEl     = document.getElementById('hint');
  const debugEl    = document.getElementById('debug');
  const dots       = [0,1,2,3].map(i => document.getElementById('dot'+i));
  const found      = [false,false,false,false];

  // ค่าเริ่มต้น — ปรับได้ผ่านปุ่ม
  let currentScale = 0.02;
  let currentRotY  = 0;   // หมุนรอบแกน Y ทีละ 90°

  const SCALE_STEP = 0.002;
  const DEFAULT_SCALE = 0.02;

  // ============================================================
  // HELPER — อัพเดต entity
  // ============================================================
  function applyTransform() {
    building.setAttribute('scale', `${currentScale} ${currentScale} ${currentScale}`);
    building.setAttribute('rotation', `-90 ${currentRotY} 0`);
    // update debug
    document.getElementById('dbg-scale').textContent = currentScale.toFixed(4);
    const p = building.getAttribute('position');
    if (p) document.getElementById('dbg-pos').textContent =
      `${p.x.toFixed(3)}, ${p.y.toFixed(3)}, ${p.z.toFixed(3)}`;
    document.getElementById('dbg-rot').textContent =
      `-90, ${currentRotY}, 0`;
  }

  // ============================================================
  // CONTROLS
  // ============================================================
  document.getElementById('btn-scale-up').addEventListener('click', () => {
    currentScale = Math.min(currentScale + SCALE_STEP, 0.2);
    applyTransform();
  });
  document.getElementById('btn-scale-down').addEventListener('click', () => {
    currentScale = Math.max(currentScale - SCALE_STEP, 0.001);
    applyTransform();
  });
  document.getElementById('btn-rot').addEventListener('click', () => {
    currentRotY = (currentRotY + 90) % 360;
    applyTransform();
  });
  document.getElementById('btn-reset').addEventListener('click', () => {
    currentScale = DEFAULT_SCALE;
    currentRotY  = 0;
    building.setAttribute('position', '0 0 0');
    applyTransform();
  });

  // ============================================================
  // DEBUG PANEL — แตะ title 3 ครั้ง
  // ============================================================
  let tapCount = 0, tapTimer = null;
  document.getElementById('title-tap').addEventListener('click', () => {
    tapCount++;
    clearTimeout(tapTimer);
    tapTimer = setTimeout(() => { tapCount = 0; }, 1000);
    if (tapCount >= 3) {
      tapCount = 0;
      debugEl.style.display = debugEl.style.display === 'none' ? 'block' : 'none';
    }
  });

  // ============================================================
  // MARKER EVENTS
  // ============================================================
  function updateHint() {
    const n = found.filter(Boolean).length;
    if (n === 0) {
      hintEl.textContent = 'ชี้กล้องไปที่ Marker บน Floor Plan';
      hintEl.className = '';
    } else if (n < 4) {
      hintEl.textContent = `พบ ${n}/4 markers — เลื่อนกล้องให้เห็น marker อื่น`;
      hintEl.className = '';
    } else {
      hintEl.textContent = '✅ พบครบ 4 markers!';
      hintEl.className = 'success';
    }
    document.getElementById('dbg-found').textContent = n;
  }

  [0,1,2,3].forEach(i => {
    const el = document.getElementById('marker'+i);

    el.addEventListener('markerFound', () => {
      found[i] = true;
      dots[i].classList.add('found');
      if (i === 0) building.setAttribute('visible', true);
      updateHint();
    });

    el.addEventListener('markerLost', () => {
      found[i] = false;
      dots[i].classList.remove('found');
      // model ยังแสดงอยู่ (last known position)
      updateHint();
    });
  });

  // ============================================================
  // GLB LOAD CHECK
  // ============================================================
  building.addEventListener('model-loaded', () => {
    console.log('✅ Test.glb โหลดสำเร็จ');
  });
  building.addEventListener('model-error', (e) => {
    console.error('❌ Test.glb error:', e);
    hintEl.textContent = '❌ โหลด Test.glb ไม่ได้ — ตรวจสอบ path ไฟล์';
    hintEl.className = 'error';
  });

  // ============================================================
  // DEBUG INTERVAL
  // ============================================================
  setInterval(() => {
    if (debugEl.style.display !== 'none') applyTransform();
  }, 500);
</script>

</body>
</html>
