<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Floor Plan AR</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #111; }
    #loading {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: #111; color: white;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      font-family: sans-serif; z-index: 9999;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 4px solid #333; border-top: 4px solid #00ff88;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading-log {
      font-size: 13px; color: #aaa;
      margin-top: 12px; text-align: left;
      padding: 0 30px; line-height: 2;
      max-width: 360px; width: 100%;
    }
    #status-bar {
      position: fixed; top: 0; left: 0; right: 0;
      background: rgba(0,0,0,0.6); color: white;
      font-family: sans-serif; font-size: 13px;
      padding: 10px 16px;
      display: none; justify-content: space-between; align-items: center;
      z-index: 999;
    }
    #marker-status { display: flex; gap: 8px; }
    .dot { width: 12px; height: 12px; border-radius: 50%; background: #555; transition: background 0.3s; }
    .dot.found { background: #00ff88; }
    #hint {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.65); color: white;
      font-family: sans-serif; font-size: 14px;
      padding: 10px 20px; border-radius: 20px;
      z-index: 999; display: none; white-space: nowrap;
    }
  </style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <h2>กำลังโหลด AR...</h2>
  <div id="loading-log"></div>
</div>

<div id="status-bar">
  <span>📐 Floor Plan AR | 1:50</span>
  <div id="marker-status">
    <div class="dot" id="dot0"></div>
    <div class="dot" id="dot1"></div>
    <div class="dot" id="dot2"></div>
    <div class="dot" id="dot3"></div>
  </div>
</div>
<div id="hint">ชี้กล้องไปที่ Marker</div>

<script>
  const logEl = document.getElementById('loading-log');
  function log(msg, color) {
    const line = document.createElement('div');
    line.textContent = msg;
    if (color) line.style.color = color;
    logEl.appendChild(line);
    console.log(msg);
  }

  // โหลด script แบบ sequential (ต้องรอตัวก่อนเสร็จก่อน)
  function loadScript(url, onSuccess, onFail) {
    const s = document.createElement('script');
    s.src = url;
    s.onload = onSuccess;
    s.onerror = onFail;
    document.head.appendChild(s);
  }

  // STEP 1: โหลด A-Frame ก่อน (ลอง 2 CDN)
  log('1/3 โหลด A-Frame...');

  const aframeCDNs = [
    'https://unpkg.com/aframe@1.3.0/dist/aframe.min.js',
    'https://cdn.jsdelivr.net/npm/aframe@1.3.0/dist/aframe.min.js'
  ];

  function loadAframe(index) {
    if (index >= aframeCDNs.length) {
      log('❌ A-Frame โหลดไม่ได้ทุก CDN — ตรวจ internet', '#ff4444');
      return;
    }
    loadScript(aframeCDNs[index],
      () => {
        log('✅ A-Frame โหลดสำเร็จ', '#00ff88');
        loadArjs(); // โหลด AR.js ต่อเมื่อ A-Frame เสร็จแล้วเท่านั้น
      },
      () => {
        log(`⚠️ CDN${index+1} ล้มเหลว ลอง CDN${index+2}...`, '#ffaa00');
        loadAframe(index + 1);
      }
    );
  }

  // STEP 2: โหลด AR.js (ลอง 2 CDN)
  const arjsCDNs = [
    'https://unpkg.com/ar.js@2.2.2/aframe/build/aframe-ar.js',
    'https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js'
  ];

  function loadArjs(index = 0) {
    log('2/3 โหลด AR.js...');
    if (index >= arjsCDNs.length) {
      log('❌ AR.js โหลดไม่ได้ทุก CDN', '#ff4444');
      return;
    }
    loadScript(arjsCDNs[index],
      () => {
        log('✅ AR.js โหลดสำเร็จ', '#00ff88');
        initScene(); // สร้าง scene เมื่อทั้งคู่พร้อม
      },
      () => {
        log(`⚠️ AR.js CDN${index+1} ล้มเหลว ลอง CDN${index+2}...`, '#ffaa00');
        loadArjs(index + 1);
      }
    );
  }

  // STEP 3: สร้าง AR Scene
  function initScene() {
    log('3/3 สร้าง AR Scene...');

    const sceneEl = document.createElement('a-scene');
    sceneEl.setAttribute('embedded', '');
    sceneEl.setAttribute('arjs', 
      'sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3; patternRatio: 0.75;'
    );
    sceneEl.setAttribute('renderer', 'logarithmicDepthBuffer: true; antialias: true; alpha: true;');
    sceneEl.setAttribute('vr-mode-ui', 'enabled: false');
    sceneEl.setAttribute('loading-screen', 'enabled: false');

    sceneEl.innerHTML = `
      <a-marker type="pattern" url="id0.patt" id="marker0" size="0.02"
        smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">
        <a-entity id="building"
          gltf-model="url(Test.glb)"
          scale="0.02 0.02 0.02"
          position="0 0 0"
          rotation="-90 0 0">
        </a-entity>
        <a-sphere color="#ff0000" radius="0.008" position="0 0.015 0"></a-sphere>
      </a-marker>

      <a-marker type="pattern" url="id1.patt" id="marker1" size="0.02"
        smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">
        <a-sphere color="#00ff00" radius="0.008" position="0 0.015 0"></a-sphere>
      </a-marker>

      <a-marker type="pattern" url="id2.patt" id="marker2" size="0.02"
        smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">
        <a-sphere color="#0000ff" radius="0.008" position="0 0.015 0"></a-sphere>
      </a-marker>

      <a-marker type="pattern" url="id3.patt" id="marker3" size="0.02"
        smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">
        <a-sphere color="#ffff00" radius="0.008" position="0 0.015 0"></a-sphere>
      </a-marker>

      <a-camera-static></a-camera-static>
    `;

    document.body.appendChild(sceneEl);

    const loadingEl = document.getElementById('loading');
    const statusBar = document.getElementById('status-bar');
    const hintEl = document.getElementById('hint');
    const dots = [0,1,2,3].map(i => document.getElementById('dot' + i));

    sceneEl.addEventListener('loaded', () => {
      log('✅ Scene พร้อม!', '#00ff88');
      setTimeout(() => {
        loadingEl.style.display = 'none';
        statusBar.style.display = 'flex';
        hintEl.style.display = 'block';
      }, 400);
    });

    // GLB check
    sceneEl.addEventListener('loaded', () => {
      const b = document.getElementById('building');
      b.addEventListener('model-loaded', () => {
        console.log('✅ Test.glb โหลดสำเร็จ');
      });
      b.addEventListener('model-error', () => {
        hintEl.textContent = '❌ โหลด Test.glb ไม่ได้ — ตรวจ path';
        hintEl.style.background = 'rgba(180,0,0,0.8)';
        hintEl.style.display = 'block';
      });
    });

    // Marker dots
    const found = [false,false,false,false];
    [0,1,2,3].forEach(i => {
      sceneEl.addEventListener('loaded', () => {
        document.getElementById('marker'+i).addEventListener('markerFound', () => {
          found[i] = true;
          dots[i].classList.add('found');
          const n = found.filter(Boolean).length;
          hintEl.textContent = n === 4 ? '✅ พบครบ 4 markers!' : `พบ ${n}/4 markers`;
        });
        document.getElementById('marker'+i).addEventListener('markerLost', () => {
          found[i] = false;
          dots[i].classList.remove('found');
        });
      });
    });

    setTimeout(() => {
      if (loadingEl.style.display !== 'none') {
        log('⚠️ Scene ยังไม่ ready หลัง 15s — ดู Console (F12)', '#ffaa00');
      }
    }, 15000);
  }

  // เริ่มโหลด
  loadAframe(0);
</script>

</body>
</html>
